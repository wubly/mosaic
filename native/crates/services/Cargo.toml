[package]
name = "mosaic-services"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
discord-rich-presence = "1.1.0"
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
lofty = "0.25.5"
lru = "0.19.1"
mosaic-core = { version = "0.5.0", path = "../core" }
percent-encoding = "2.3.2"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "gzip", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tracing = "0.1.44"
unicode-normalization = "0.1.26"
url = "2.5.9"
walkdir = "2.5.1"

[dev-dependencies]
mosaic-core = { path = "../core" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
