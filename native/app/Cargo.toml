[package]
name = "mosaic"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
iced = { version = "0.14.0", features = ["tokio", "image", "canvas", "advanced"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
material-colors = { version = "0.5.0", features = ["quantize"] }
mosaic-audio = { version = "0.5.0", path = "../crates/audio" }
mosaic-core = { version = "0.5.0", path = "../crates/core" }
mosaic-services = { version = "0.5.0", path = "../crates/services" }
rand = "0.10"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }

[features]
default = ["debug-cli"]
debug-cli = []
