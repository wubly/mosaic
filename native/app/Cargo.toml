[package]
name = "mosaic"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
iced = { version = "0.14.0", features = ["tokio", "image", "canvas", "advanced"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
material-colors = { version = "0.5.0", features = ["quantize"] }
mosaic-audio = { version = "0.5.0", path = "../crates/audio" }
mosaic-core = { version = "0.5.0", path = "../crates/core" }
mosaic-platform = { version = "0.5.0", path = "../crates/platform" }
mosaic-services = { version = "0.5.0", path = "../crates/services", default-features = false }
rand = "0.10"
rfd = "0.18.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
unicode-normalization = "0.1.26"

[features]
default = ["debug-cli", "spotify"]
debug-cli = []
spotify = ["mosaic-services/spotify"]

[package.metadata.packager]
product-name = "Mosaic"
identifier = "app.mosaic.player"
binaries = [{ path = "mosaic", main = true }]
icons = ["../assets/icon.png", "../assets/icon.ico"]
formats = ["appimage", "deb", "nsis", "dmg"]
description = "SoundCloud and your own music in one player"
category = "Music"

[package.metadata.packager.deb]
depends = ["libasound2"]
desktop-template = "../packaging/linux/app.mosaic.player.desktop"
