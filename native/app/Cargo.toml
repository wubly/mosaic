[package]
name = "mosaic"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.9"
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
iced = { version = "0.14.0", features = ["tokio", "image", "canvas", "advanced"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
material-colors = { version = "0.5.0", features = ["quantize"] }
mosaic-audio = { version = "0.6.0", path = "../crates/audio" }
mosaic-core = { version = "0.6.0", path = "../crates/core" }
mosaic-platform = { version = "0.6.0", path = "../crates/platform" }
mosaic-services = { version = "0.6.0", path = "../crates/services", default-features = false }
rand = "0.10"
rfd = "0.18.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"

[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded"] }
libc = "0.2"

[features]
default = ["debug-cli", "spotify"]
debug-cli = []
spotify = ["mosaic-services/spotify"]

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.packager]
product-name = "Mosaic"
identifier = "app.mosaic.player"
binaries = [{ path = "mosaic", main = true }]
icons = ["../assets/icon.png", "../assets/icon.ico"]
formats = ["appimage", "deb", "nsis", "dmg"]
description = "SoundCloud and your own music in one player"
category = "Music"

# "-" is an ad-hoc signature, enough for Apple Silicon to run it; the release workflow swaps in
# a Developer ID when the APPLE_* secrets are set (and then notarizes).
[package.metadata.packager.macos]
minimum-system-version = "11.0"
signing-identity = "-"

[package.metadata.packager.deb]
depends = ["libasound2"]
